[package]
name = "gitfox-cli"
description = "fx - GitFox CLI for humans, CI and AI agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["gitfox", "cli", "git", "devops", "ci"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "fx"
path = "src/main.rs"

[features]
default = []
# Statically link libdbus so a prebuilt Linux binary has no runtime dependency
# on it. Without this the binary will not start on a machine or container that
# lacks libdbus-1.so.3 — which is most minimal images, exactly where CI and
# agents run. Only meaningful on Linux; a no-op elsewhere.
vendored-keychain = ["keyring/vendored"]

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.9"
comfy-table = "8.0.0"
dialoguer = "0.12.0"
directories = "6.0.0"
gitfox-client.workspace = true
# `--template`: Go's text/template, which is what gh's --template speaks.
gtmpl-ng = "0.7.7"
# `--jq`: a jq implementation, so `--jq` needs no jq on PATH.
jaq-core = "3.1.1"
jaq-json = "2.0.3"
jaq-std = "3.0.3"
keyring = { version = "3.6.3", features = [
    "apple-native",
    "sync-secret-service",
    "windows-native",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"
