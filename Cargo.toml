[workspace]
resolver = "3"
members = ["crates/gitfox-client", "crates/fx-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/haowei2000/gitfox-cli"
authors = ["GitFox CLI contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
